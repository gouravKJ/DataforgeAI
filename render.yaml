# DataForge AI — Render Blueprint
#
# Deploy in one step: Render Dashboard → New + → Blueprint → pick this repo.
# Render creates the Postgres database, wires DATABASE_URL automatically,
# and prompts you for GROQ_API_KEY (optional — the app degrades to the
# local engine without it).
#
# Docs: https://render.com/docs/blueprint-spec

# Note: Render's free Postgres tier expires 30 days after creation — upgrade the
# plan or swap in a Neon/Supabase URL for anything beyond a demo.
databases:
  - name: dataforge-db
    databaseName: dataforge
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: dataforge-ai
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run render:build
    startCommand: npm run render:start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Wired automatically from the database above (available during build too,
      # so `prisma db push` runs at build time).
      - key: DATABASE_URL
        fromDatabase:
          name: dataforge-db
          property: connectionString
      # Session signing secret — generated once, kept across deploys.
      - key: APP_SECRET
        generateValue: true
      # Optional. Leave empty to run on the deterministic local AI engine.
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: NODE_VERSION
        value: "20"
      # NOTE: do NOT set NODE_ENV here. `npm ci` would skip devDependencies
      # (TypeScript, Tailwind, Prisma CLI) and the build would fail. Next.js
      # sets NODE_ENV=production for `next start` on its own.
